services:
  backend:
    develop:
      watch:
        - action: sync
          path: ./app
          target: /usr/src/app
          ignore:
            - .venv/
        - action: rebuild
          path: ./pyproject.toml
    environment:
      SKIP_DDRAGON_CHOWN: "1"
    volumes:
      - ./app:/usr/src/app
      - ./ddragon:/usr/src/ddragon
  
  database:
    ports:
      - 5432:5432

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - 5540:5540
    volumes:
      - redisinsight:/data

  rq-dashboard:
    image: cjlapao/rq-dashboard:latest
    ports:
      - 9181:9181
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://nexus-iq-redis-1:6379/0
    depends_on:
      - redis

volumes:
  redisinsight:
