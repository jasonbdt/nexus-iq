# Production-oriented overlay: persistent CDN volume and first-start Data Dragon sync.
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up -d
# Do not combine with compose.override.yaml (bind-mount + named volume on cdn conflict).
services:
  backend:
    environment:
      DDRAGON_SYNC_ON_START: "true"
    volumes:
      - ddragon_cdn:/usr/src/ddragon/cdn

volumes:
  ddragon_cdn:
