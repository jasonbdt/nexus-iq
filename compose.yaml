services:
  backend:
    build:
      context: .
    env_file: ".env"
    image: nexus-iq/backend
    ports:
      - 8000:8000
    environment:
      DDragon_CACHE_DIR: /usr/src/ddragon/cdn
      DDRAGON_SYNC_ON_START: "false"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: nexus-iq/frontend
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8000
    ports:
      - 4200:4200
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: geheim2
      POSTGRES_DB: nexus_iq
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8.6.1

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    env_file: ".env"
    environment:
      REDIS_HOST: redis
    image: nexus-iq/rq-worker
    command: uv run rq worker default --with-scheduler
    deploy:
      replicas: 3
    depends_on:
      - redis

volumes:
  pgdata:
  qdrant_storage:
